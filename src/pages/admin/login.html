<!DOCTYPE html>
<html lang="fr" dir="ltr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Administration - Carrière Bhalil</title>
    <link rel="stylesheet" href="/src/css/variables.css">
    <link rel="stylesheet" href="/src/css/base.css">
    <link rel="stylesheet" href="/src/css/components.css">
    <style>
        body {
            background-color: var(--color-dark);
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }

        .login-card {
            background: white;
            padding: var(--spacing-8);
            border-radius: var(--radius-xl);
            box-shadow: var(--shadow-xl);
            width: 100%;
            max-width: 400px;
            text-align: center;
        }

        .login-logo {
            font-size: 2rem;
            font-weight: bold;
            color: var(--color-dark);
            margin-bottom: var(--spacing-6);
            display: block;
        }

        .admin-badge {
            background: var(--color-error);
            color: white;
            padding: 2px 8px;
            border-radius: 4px;
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
    </style>
</head>

<body>
    <div class="login-card">
        <a href="/" class="login-logo">CB <span class="admin-badge">Admin</span></a>
        <h2 style="margin-bottom: var(--spacing-6);">Connexion RH</h2>

        <form action="./dashboard.html">
            <div class="form-group" style="text-align: left;">
                <label class="form-label">Identifiant</label>
                <input type="text" class="form-input" required placeholder="admin">
            </div>

            <div class="form-group" style="text-align: left;">
                <label class="form-label">Mot de passe</label>
                <input type="password" class="form-input" required placeholder="••••••••">
            </div>

            <button type="submit" class="btn btn-secondary"
                style="width: 100%; background-color: var(--color-dark); color: white;">Accéder au Portail</button>
        </form>
    </div>
</body>

</html>
